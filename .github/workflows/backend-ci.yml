name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Django system checks
        env:
          SECRET_KEY: ci-only-not-a-real-key
          DEBUG: "True"
        run: python manage.py check

      - name: Django deploy checks (prod mode)
        env:
          SECRET_KEY: ci-only-not-a-real-key
          DEBUG: "False"
          ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "False"  # CI no tiene HTTPS
          SECURE_HSTS_SECONDS: "0"
        run: python manage.py check --deploy --fail-level WARNING
        continue-on-error: true  # warnings de deploy son informativos por ahora

      - name: Migrations up-to-date?
        env:
          SECRET_KEY: ci-only-not-a-real-key
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          SECRET_KEY: ci-only-not-a-real-key
          DEBUG: "True"
        run: |
          pytest core/test_password_reset.py core/test_perfil.py \
                 core/test_bookmarks_contenido.py core/test_editar_respuestas.py \
                 core/test_reiniciar.py \
                 -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t servel-backend:ci -f backend/Dockerfile backend/
