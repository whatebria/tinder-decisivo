name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # Guardian del catalogo: falla el PR si alguien agrega un componente
      # sin .showcase.tsx colocated, o si el catalogo generado en disk esta
      # desactualizado respecto a los sources, o si los props declarados en
      # un showcase no matchean con la interface real del componente.
      #
      # Corre:
      #   1. generate-catalog --strict  -> diff entre index.generated.ts en
      #      disk vs el que se generaria hoy. Falla si difieren.
      #   2. verify-props               -> extrae props via TS Compiler API y
      #      compara con lo declarado en cada .showcase.tsx.
      - name: Catalog integrity check
        run: npm run catalog:check

      # Corre TODA la suite (incluye catalog-completeness.test.ts que
      # cuenta componentes en src/components/{cat}/ y falla si alguno no
      # tiene .showcase.tsx sibling).
      - name: Run tests
        run: npm test -- --ci --maxWorkers=2
