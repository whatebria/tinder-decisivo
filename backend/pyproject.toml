[project]
name = "servel-backend"
version = "0.1.0"
description = "API REST para Servel - matching votante/candidato"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-cleanup>=9.0",
    "python-decouple>=3.8",
    "Pillow>=10.3",
    "feedparser>=6.0",
    "drf-spectacular>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra --strict-markers"
